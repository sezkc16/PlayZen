name: PlayZen

options:
  bundleIdPrefix: com.Toji
  deploymentTarget:
    iOS: "17.0"

targets:
  PlayZen:
    type: application
    platform: iOS

    sources:
      - path: app

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PlayZen
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Toji.playzen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
